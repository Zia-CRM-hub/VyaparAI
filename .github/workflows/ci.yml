name: CI
on:
  push:
    branches: [main]
  pull_request:


jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vyapar
          POSTGRES_PASSWORD: vyapar
          POSTGRES_DB: vyaparai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vyapar" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://vyapar:vyapar@localhost:5432/vyaparai?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
