services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vyapar
      POSTGRES_PASSWORD: vyapar
      POSTGRES_DB: vyaparai
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyapar -d vyaparai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  app:
    build: .
    profiles: ["full"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://vyapar:vyapar@db:5432/vyaparai?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]

volumes:
  pgdata:
